name: Nightly train + batch score
on:
  schedule: [{ cron: "15 2 * * *" }]
  workflow_dispatch:
jobs:
  nightly:
    runs-on: ubuntu-latest
    env: { MLFLOW_DISABLE_AGENT_HINT: "1" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]" evidently
      - name: Get data (real PaySim when the KAGGLE_API_TOKEN secret is set, else synthetic)
        env: { KAGGLE_API_TOKEN: "${{ secrets.KAGGLE_API_TOKEN }}" }
        run: |
          if [ -n "$KAGGLE_API_TOKEN" ]; then ./scripts/download_paysim.sh; else auditlens generate --rows 200000; fi
          auditlens generate --rows 20000 --seed 99 --out data/new/today.csv
      - name: Train
        env: { AUDITLENS_DATA__SAMPLE_ROWS: "1000000" }
        run: auditlens train --trials 10
      - run: auditlens batch --input data/new/today.csv
      - uses: actions/upload-artifact@v4
        with: { name: nightly-reports, path: reports/ }
