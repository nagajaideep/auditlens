[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditlens"
version = "0.1.0"
description = "ML + GenAI platform for spotting risky financial transactions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.1,<3", "numpy>=1.26", "scikit-learn>=1.4", "xgboost>=2.0", "optuna>=3.5",
  "mlflow>=2.12", "shap>=0.45", "pandera>=0.20", "statsmodels>=0.14",
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "pyyaml>=6.0",
  "sqlalchemy>=2.0", "psycopg2-binary>=2.9", "matplotlib>=3.8", "seaborn>=0.13",
  "joblib>=1.3", "tabulate>=0.9", "pyarrow>=15", "python-dotenv>=1.0", "pypdf>=4.0",
]

[project.optional-dependencies]
genai = ["chromadb>=0.5", "sentence-transformers>=2.7", "anthropic>=0.70", "openai>=1.40"]
forecast = ["prophet>=1.1.5"]
monitoring = ["evidently>=0.4", "streamlit>=1.33"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
auditlens = "auditlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "E702"]
