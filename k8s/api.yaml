apiVersion: apps/v1
kind: Deployment
metadata: { name: auditlens-api, namespace: auditlens, labels: { app: auditlens-api } }
spec:
  replicas: 2
  selector: { matchLabels: { app: auditlens-api } }
  template:
    metadata: { labels: { app: auditlens-api } }
    spec:
      containers:
        - name: api
          image: auditlens:latest          # minikube: `minikube image load auditlens:latest`
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: auditlens-config }
            - secretRef: { name: auditlens-secrets, optional: true }
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: "1", memory: 2Gi }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 30, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: auditlens-api, namespace: auditlens }
spec:
  type: NodePort
  selector: { app: auditlens-api }
  ports: [{ port: 80, targetPort: 8000, nodePort: 30080 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: auditlens-api, namespace: auditlens }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: auditlens-api }
  minReplicas: 2
  maxReplicas: 5
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
